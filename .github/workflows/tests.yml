name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installeren
        run: make install

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Frontmatter van agents, skills en instructies
        run: make check-agents
